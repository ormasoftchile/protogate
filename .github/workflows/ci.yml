name: CI/CD Pipeline

on:
  push:
    branches: [ main, 'feature/**', '001-tunnel-core-server' ]
  pull_request:
    branches: [ main ]

env:
  VCPKG_DEFAULT_TRIPLET: x64-linux
  BUILD_TYPE: Release

jobs:
  lint:
    name: Code Style Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-14
      
      - name: Check code formatting
        run: |
          find src tests -name '*.cpp' -o -name '*.h' | \
          xargs clang-format-14 --dry-run --Werror

  build:
    name: Build and Test
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build_type: [Debug, Release]
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc-11
            cxx: g++-11
          - compiler: clang
            cc: clang-14
            cxx: clang++-14
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache vcpkg
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/vcpkg
            vcpkg_installed
          key: ${{ runner.os }}-vcpkg-${{ matrix.compiler }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ matrix.compiler }}-
            ${{ runner.os }}-vcpkg-
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            ${{ matrix.cc }} \
            ${{ matrix.cxx }} \
            libssl-dev \
            pkg-config
      
      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV
      
      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DBUILD_TESTING=ON
      
      - name: Build
        run: cmake --build build --parallel
      
      - name: Run Unit Tests
        if: matrix.build_type == 'Release'
        run: |
          if [ -f build/unit_tests ]; then
            ./build/unit_tests --gtest_output=xml:test-results/unit-tests.xml
          else
            echo "Unit tests not built yet"
          fi
      
      - name: Run Integration Tests
        if: matrix.build_type == 'Release'
        run: |
          if [ -f build/integration_tests ]; then
            ./build/integration_tests --gtest_output=xml:test-results/integration-tests.xml
          else
            echo "Integration tests not built yet"
          fi
      
      - name: Upload Test Results
        if: always() && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.compiler }}
          path: test-results/
          retention-days: 30

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            clang-14 \
            clang-tidy-14 \
            cppcheck \
            libssl-dev
      
      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV
      
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=clang++-14 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
      
      - name: Run clang-tidy
        run: |
          if [ -f build/compile_commands.json ]; then
            find src -name '*.cpp' | head -10 | \
            xargs clang-tidy-14 -p build --warnings-as-errors=* || true
          fi
      
      - name: Run cppcheck
        run: |
          cppcheck --enable=all --inconclusive --suppress=missingIncludeSystem \
            --error-exitcode=0 --xml --xml-version=2 \
            src/ 2> cppcheck-report.xml || true

  docker:
    name: Docker Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.alpine
          push: false
          tags: protogate-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker Image
        run: |
          echo "Docker image built successfully"
          # TODO: Add container smoke tests

  security:
    name: Security Scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
